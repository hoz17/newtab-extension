<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/png" href="./favicon.png">

</head>

<body>
    <div id="bgLayer" aria-hidden="true"></div>
    <video id="bgVideo" aria-hidden="true" muted loop playsinline></video>
    <header class="topbar">
        <div class="brand">
            <div class="dot"></div>
            <div>
                <div class="title" id="greeting">Welcome Back</div>
                <div class="subtitle" id="nameArea"></div>
            </div>
        </div>

        <div class="clock" aria-live="polite">
            <div class="clock-box">
                <div class="clock-time" id="clockTime">--:--:--</div>
                <div class="clock-date" id="clockDate">--</div>
            </div>
        </div>

        <div class="actions">
            <input id="search" type="search" placeholder="Tìm nhanh…  ( / )" autocomplete="off" />
            <select id="sortMode" class="btn btn-secondary" title="Sắp xếp liên kết trong nhóm">
                <option value="manual">Thủ công</option>
                <option value="opens">Hay dùng</option>
            </select>
            <button id="btnAdd" class="btn" title="Thêm website (N)">Thêm</button>
            <button id="btnNotes" class="btn btn-secondary" title="Ghi chú / việc cần làm">Ghi chú</button>
            <button id="btnSettings" class="btn btn-secondary" title="Cài đặt">⚙️ Cài đặt</button>
        </div>
    </header>
    <nav class="chips" id="chips" aria-label="Nhóm"></nav>

    <main class="container">
        <section id="grid" class="grid" aria-label="Danh sách liên kết"></section>

        <section class="hint" hidden>
            <div class="hint-title">Gợi ý thumbnail</div>
            <ul>
                <li>Chụp screenshot trang → lưu vào thư mục <code>thumbs/</code> → đặt <code>thumb</code> là
                    <code>./thumbs/tenfile.png</code>.
                </li>
                <li>Nếu không có <code>thumb</code>, hệ thống sẽ dùng favicon (cần internet).</li>
            </ul>
        </section>

    </main>

    <!-- Modal -->
    <dialog id="modal" class="modal">
        <form id="form" method="dialog" class="modal-card">
            <div class="modal-head">
                <div id="modalTitle" class="modal-title">Thêm website</div>
                <button id="btnClose" class="icon-btn" value="cancel" aria-label="Đóng">✕</button>
            </div>

            <div class="modal-body">
                <label class="field">
                    <div class="label">Tên</div>
                    <input id="fName" required placeholder="Ví dụ: Jira" />
                </label>

                <label class="field">
                    <div class="label">Link</div>
                    <input id="fUrl" required placeholder="https://…" inputmode="url" />
                </label>

                <label class="field">
                    <div class="label">Group</div>
                    <input id="fGroup" placeholder="Ví dụ: Dev / PM / Admin" />
                </label>

                <label class="field">
                    <div class="label">Thumbnail (tuỳ chọn)</div>
                    <input id="fThumb" placeholder="./thumbs/jira.png" />
                    <div class="help">Dùng đường dẫn tương đối. Ví dụ: <code>./thumbs/jira.png</code></div>
                </label>
            </div>

            <div class="modal-foot">
                <input type="hidden" id="fId" />
                <button id="btnDelete" class="btn btn-danger" type="button">Xoá</button>
                <div class="spacer"></div>
                <button class="btn btn-secondary" value="cancel" type="button" id="btnCancel">Huỷ</button>
                <button class="btn" value="default" type="submit">Lưu</button>
            </div>
        </form>
    </dialog>

    <!-- Modal đổi hình nền -->
    <dialog id="bgModal" class="modal">
        <form id="bgForm" method="dialog" class="modal-card">
            <div class="modal-head">
                <div class="modal-title">Hình nền</div>
                <button id="btnBgClose" class="icon-btn" value="cancel" type="button" aria-label="Đóng">✕</button>
            </div>

            <div class="modal-body">
                <div class="bg-preview" id="bgPreview">Chưa có ảnh nền</div>

                <label class="field">
                    <div class="label">Đường dẫn ảnh / video (mỗi dòng một đường dẫn)</div>
                    <textarea id="bgPaths" rows="3"
                        placeholder="./background/photo.jpg&#10;./background/clip.mp4"></textarea>
                    <div class="help">Đặt ảnh / GIF / video vào <code>./Dashboard/background/</code> rồi
                        tham chiếu tại đây. Ví dụ: <code>./background/photo.jpg</code>,
                        <code>./background/anim.gif</code>, <code>./background/clip.mp4</code>. Nhiều dòng =
                        nhiều nền. Video luôn được tắt tiếng.</div>
                </label>

                <label class="field">
                    <div class="label">Chế độ nhiều nền</div>
                    <select id="bgMode">
                        <option value="static">Một nền cố định (dòng đầu)</option>
                        <option value="random">Ngẫu nhiên mỗi lần mở tab</option>
                        <option value="rotate">Xoay vòng theo thời gian</option>
                    </select>
                </label>

                <label class="field" id="bgIntervalField">
                    <div class="label">Đổi nền sau mỗi (phút)</div>
                    <input id="bgInterval" type="number" min="1" max="240" step="1" value="10" />
                </label>

                <label class="field">
                    <div class="label">Độ tối lớp phủ: <span id="bgDimVal">35%</span></div>
                    <input id="bgDim" type="range" min="0" max="80" step="1" value="35" />
                </label>

                <label class="field">
                    <div class="label">Làm mờ: <span id="bgBlurVal">0px</span></div>
                    <input id="bgBlur" type="range" min="0" max="20" step="1" value="0" />
                </label>
            </div>

            <div class="modal-foot">
                <button id="btnBgRemove" class="btn btn-danger" type="button">Xoá nền</button>
                <div class="spacer"></div>
                <button class="btn btn-secondary" type="button" id="btnBgCancel">Huỷ</button>
                <button class="btn" type="submit" id="btnBgApply">Áp dụng</button>
            </div>
        </form>
    </dialog>

    <!-- Panel cài đặt (side bar) -->
    <aside id="settingsPanel" class="settings-panel" aria-label="Cài đặt">
        <div class="settings-head">
            <div class="settings-title">Cài đặt</div>
            <button id="btnSettingsClose" class="icon-btn" type="button" aria-label="Đóng">✕</button>
        </div>
        <div class="settings-body">
            <div class="settings-group">
                <div class="settings-label">Giao diện</div>
                <button id="btnTheme" class="btn btn-secondary settings-item" title="Đổi giao diện sáng / tối">🌙
                    Sáng / Tối</button>
                <button id="btnBg" class="btn btn-secondary settings-item" title="Đổi hình nền">🖼️ Hình nền</button>
            </div>
            <div class="settings-group">
                <div class="settings-label">Dữ liệu</div>
                <button id="btnExport" class="btn btn-secondary settings-item">⬇️ Export dữ liệu</button>
                <button id="btnImport" class="btn btn-secondary settings-item">⬆️ Import dữ liệu</button>
                <button id="btnReset" class="btn btn-secondary settings-item" title="Khôi phục danh sách mặc định">♻️
                    Khôi phục mặc định</button>
                <input id="importFile" type="file" accept="application/json" hidden />
            </div>
        </div>
    </aside>

    <!-- Panel ghi chú / việc cần làm -->
    <aside id="notesPanel" class="notes-panel" aria-label="Ghi chú">
        <div class="notes-head">
            <div class="notes-title">Việc cần làm</div>
            <button id="btnNotesClose" class="icon-btn" type="button" aria-label="Đóng">✕</button>
        </div>
        <form id="notesForm" class="notes-add">
            <input id="notesInput" placeholder="Thêm việc… (Enter)" autocomplete="off" maxlength="200" />
        </form>
        <ul id="notesList" class="notes-list"></ul>
    </aside>

    <!-- Thông báo (toast + hoàn tác) -->
    <div id="toastHost" class="toast-host" aria-live="polite"></div>

    <script src="./app.js"></script>
</body>

</html>
